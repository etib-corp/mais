name: Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Pinned so CI, the examples, and a developer machine agree on one version.
  PYTHON_VERSION: "3.13"

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            operating-system: linux
            runner: ubuntu-latest
          - name: macOS
            operating-system: macos
            runner: macos-latest
          - name: Windows
            operating-system: windows
            runner: windows-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Install Linux dependencies
        if: matrix.operating-system == 'linux'
        run: bash scripts/install_ubuntu_dependencies.sh

      - name: Set up Python
        if: matrix.operating-system != 'linux'
        uses: actions/setup-python@v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure CMake
        # pybind11 owns Python discovery and finds the interpreter first on
        # PATH, which is the one the setup step installed.
        run: >
          cmake -B ${{ github.workspace }}/build -S ${{ github.workspace }}
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=ON

      - name: Build
        run: >
          cmake --build ${{ github.workspace }}/build

      - name: Run tests
        run: >
          ctest
          --test-dir ${{ github.workspace }}/build
          --output-on-failure
