name: Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Pinned so CI, the examples, and a developer machine agree on one version.
  PYTHON_VERSION: "3.13"
  # Multi-config generators (Visual Studio on Windows) ignore CMAKE_BUILD_TYPE.
  # One value is threaded through configure, build, and CTest so all three
  # agree; on single-config generators (Makefiles/Ninja) it is ignored where it
  # does not apply.
  BUILD_CONFIG: "Release"

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            operating-system: linux
            runner: ubuntu-latest
          - name: macOS
            operating-system: macos
            runner: macos-latest
          - name: Windows
            operating-system: windows
            runner: windows-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Install Linux dependencies
        if: matrix.operating-system == 'linux'
        run: bash scripts/install_ubuntu_dependencies.sh

      - name: Set up Python
        if: matrix.operating-system != 'linux'
        uses: actions/setup-python@v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure CMake
        # pybind11 owns Python discovery and finds the interpreter first on
        # PATH, which is the one the setup step installed. CMAKE_BUILD_TYPE only
        # applies to single-config generators; multi-config ones take the
        # configuration at build time.
        run: >
          cmake -B ${{ github.workspace }}/build -S ${{ github.workspace }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }}
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=ON

      - name: Build
        # --config selects the configuration on multi-config generators and is
        # ignored by single-config ones.
        run: >
          cmake --build ${{ github.workspace }}/build
          --config ${{ env.BUILD_CONFIG }}

      - name: Ensure tests were registered
        # gtest_discover_tests() resolves its per-configuration include through
        # the CTest configuration. Without -C it registers nothing on a
        # multi-config generator, and a run with zero tests would still pass.
        shell: bash
        run: |
          set -euo pipefail
          # grep exits 1 on no match; tolerate it so the check below reports.
          registered=$(ctest \
            --test-dir "${{ github.workspace }}/build" \
            -C "${{ env.BUILD_CONFIG }}" -N \
            | grep -cE 'Test +#[0-9]+:' || true)
          echo "Registered CTest tests: ${registered}"
          if [ "${registered}" -eq 0 ]; then
            echo "::error::No tests were registered; the test suite did not launch."
            exit 1
          fi

      - name: Run tests
        # -C is required by multi-config generators. Without it CTest cannot
        # resolve the test commands, and gtest_discover_tests() registers no
        # tests at all, so the GoogleTest suite would be skipped rather than
        # reported as failing.
        run: >
          ctest
          --test-dir ${{ github.workspace }}/build
          -C ${{ env.BUILD_CONFIG }}
          --output-on-failure
