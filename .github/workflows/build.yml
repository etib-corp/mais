name: Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Multi-config generators (Visual Studio on Windows) ignore CMAKE_BUILD_TYPE.
  # One value is threaded through configure, build, and CTest so all three
  # agree; on single-config generators (Makefiles/Ninja) it is ignored where it
  # does not apply.
  BUILD_CONFIG: "Release"

jobs:
  support-matrix:
    name: Resolve the support matrix
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Read the supported Python versions
        # cmake/PythonSupport.cmake declares the supported range once and is
        # what configure enforces. The build matrix is generated from it, so
        # the versions CI tests and the versions CMake accepts cannot drift
        # apart, and the list is not repeated per job.
        id: resolve
        run: |
          set -euo pipefail
          cmake -DMAIS_PYTHON_MATRIX_OUT="$RUNNER_TEMP/versions.json" \
            -P cmake/PythonSupport.cmake
          versions="$(cat "$RUNNER_TEMP/versions.json")"
          if [ "${versions}" = "[]" ]; then
            echo "::error::cmake/PythonSupport.cmake declared no versions."
            exit 1
          fi
          echo "Supported Python versions: ${versions}"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: support-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python version, on every supported platform. Only
        # add a version to the axis above by adding it to
        # cmake/PythonSupport.cmake; it then has to pass here on all three
        # platforms before it can be called supported.
        python: ${{ fromJSON(needs.support-matrix.outputs.versions) }}
        os: [ ubuntu-24.04, macos-latest, windows-latest ]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Install Linux build dependencies
        # The interpreter comes from actions/setup-python below, the same
        # source macOS and Windows use. Installing the distro python3-dev here
        # as well once left discovery resolving the interpreter and the linked
        # library to two different installations.
        if: matrix.os == 'ubuntu-24.04'
        env:
          MAIS_INSTALL_PYTHON_DEV: "0"
        run: bash scripts/install_ubuntu_dependencies.sh

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Configure CMake
        # pybind11 owns Python discovery and finds the interpreter first on
        # PATH, which is the one the setup step installed. CMAKE_BUILD_TYPE only
        # applies to single-config generators; multi-config ones take the
        # configuration at build time.
        run: >
          cmake -B ${{ github.workspace }}/build -S ${{ github.workspace }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }}
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=ON

      - name: Build
        # --config selects the configuration on multi-config generators and is
        # ignored by single-config ones.
        run: >
          cmake --build ${{ github.workspace }}/build
          --config ${{ env.BUILD_CONFIG }}

      - name: Ensure tests were registered
        # gtest_discover_tests() resolves its per-configuration include through
        # the CTest configuration. Without -C it registers nothing on a
        # multi-config generator, and a run with zero tests would still pass.
        shell: bash
        run: |
          set -euo pipefail
          # grep exits 1 on no match; tolerate it so the check below reports.
          registered=$(ctest \
            --test-dir "${{ github.workspace }}/build" \
            -C "${{ env.BUILD_CONFIG }}" -N \
            | grep -cE 'Test +#[0-9]+:' || true)
          echo "Registered CTest tests: ${registered}"
          if [ "${registered}" -eq 0 ]; then
            echo "::error::No tests were registered; the test suite did not launch."
            exit 1
          fi

      - name: Run tests
        # -C is required by multi-config generators. Without it CTest cannot
        # resolve the test commands, and gtest_discover_tests() registers no
        # tests at all, so the GoogleTest suite would be skipped rather than
        # reported as failing.
        run: >
          ctest
          --test-dir ${{ github.workspace }}/build
          -C ${{ env.BUILD_CONFIG }}
          --output-on-failure
